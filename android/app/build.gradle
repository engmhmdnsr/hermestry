apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "ee.oversight.hermes.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ee.oversight.hermes.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 90
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // ABI support note (GATEWAY-02): Hermes on-device runtime is
            // aarch64-centered. arm64-v8a is the primary shipping ABI.
            // x86_64 is kept for emulators and x86_64 test devices.
            // armeabi-v7a (32-bit) is excluded: the gateway native deps
            // assume a 64-bit runtime, so 32-bit .so files only grow the
            // APK without a supported runtime path.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Upload key + credentials live OUTSIDE the repo (secure home
            // dir); repo-root copies only help a fresh checkout on another
            // machine. Nothing is committed.
            def creds = new Properties()
            def homeCreds = file("${System.getProperty("user.home")}/AppData/Local/hermes/android-keystore/keystore-credentials.txt")
            def rootCreds = file("${rootDir}/keystore-credentials.txt")
            def credsFile = homeCreds.exists() ? homeCreds : rootCreds
            if (credsFile.exists()) {
                credsFile.withInputStream { creds.load(it) }
            }
            def homeKeystore = file("${System.getProperty("user.home")}/AppData/Local/hermes/android-keystore/hermes-control-release.jks")
            def envPath = System.getenv("KEYSTORE_PATH")
            def envStore = envPath?.trim() ? file(envPath) : null
            storeFile = (envStore?.exists() ? envStore : (homeKeystore.exists() ? homeKeystore : null))
            storePassword = System.getenv("STORE_PASSWORD") ?: creds.getProperty("STORE_PASSWORD") ?: ""
            keyAlias = System.getenv("KEY_ALIAS") ?: creds.getProperty("KEY_ALIAS") ?: "upload"
            keyPassword = System.getenv("KEY_PASSWORD") ?: creds.getProperty("KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Play requires a signed AAB; the AAB is built from this same
            // config (:app:bundleRelease). Play App Signing re-signs on top.
            if (signingConfigs.release.storeFile?.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // On-device gateway runner (restored native code, Capacitor bridge only).
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "org.apache.commons:commons-compress:1.26.1"
    implementation "org.tukaani:xz:1.10"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
