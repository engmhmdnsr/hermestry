<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ic_hermes_logo.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/ic_hermes_logo_dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hermes</title>
    <style>html{background-color:#F1F5F9}html[data-mode="dark"]{background-color:#090B14}</style>
    <script>
      try {
        (function () {
          var mode = 'dark';
          var lang = 'en';
          try {
            var raw = localStorage.getItem('hermes_settings');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && typeof parsed.themeMode === 'string') mode = parsed.themeMode;
              if (parsed && typeof parsed.language === 'string') lang = parsed.language;
            }
          } catch (e) {}
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'dark';
          if (['en', 'ar', 'zh', 'ja', 'ru', 'fr', 'de', 'es'].indexOf(lang) < 0) lang = 'en';
          var dark = true;
          if (mode === 'light') dark = false;
          else if (mode === 'system' && window.matchMedia) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
          document.documentElement.style.backgroundColor = dark ? '#090B14' : '#F1F5F9';
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', dark ? '#090B14' : '#F1F5F9');
          // U3: lang/dir before first paint, so Arabic never flashes an
          // English LTR frame before React hydrates.
          var rtl = lang === 'ar';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
        })();
      } catch (e) {}
    </script>
    <meta name="description" content="On-phone and remote Hermes AI gateway client with live streaming, session management, scheduled cron jobs, approvals, and system diagnostics." />
